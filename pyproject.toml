[project]
name = "sim-satellite"
version = "0.1.0"
description = "End-to-end exploration of conditional satellite-image diffusion."
readme = "Readme.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "fastapi>=0.115",
    "matplotlib>=3.9",
    "modal>=1.0",
    "pillow>=10.0",
    "rasterio>=1.5.0",
    "torch>=2.3",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
vae = [
    "accelerate>=0.33",
    "diffusers>=0.30",
]

[project.scripts]
sim-satellite = "sim_satellite.cli:cli"

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = [
    "src",
]

[tool.pyright]
include = [
    "src",
    "tests",
]
exclude = [
    "artifacts",
    "data",
]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "artifacts",
    "data",
]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
]

[tool.ruff.format]
line-ending = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
