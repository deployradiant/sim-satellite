<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sim Satellite</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111111;
      --muted: #626262;
      --line: #d8d8d8;
      --panel: #f7f7f7;
      --panel-strong: #ededed;
      --accent: #4a4a4a;
      --accent-strong: #303030;
      --accent-soft: #e4e4e4;
      --accent-contrast: #ffffff;
      --accent-contrast-strong: #ffffff;
      --warn: #b3261e;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "Helvetica Neue", Arial, ui-sans-serif, sans-serif;
      color: var(--ink);
      background: #fbfbfb;
    }
    ::selection {
      background: var(--accent-soft);
      color: var(--ink);
    }
    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto auto auto 1fr auto;
    }
    header {
      grid-row: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: 0;
    }
    .meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      text-align: right;
      overflow-wrap: anywhere;
    }
    .controls {
      display: grid;
      grid-template-columns: minmax(180px, 300px) repeat(2, minmax(74px, 88px)) auto;
      gap: 10px;
      align-items: end;
      justify-content: end;
      margin-left: auto;
    }
    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }
    select,
    input,
    button {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
      font-size: 14px;
      background: #ffffff;
      color: var(--ink);
    }
    select,
    input {
      padding: 0 10px;
      width: 100%;
    }
    button {
      padding: 0 16px;
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-contrast);
      font-weight: 700;
      cursor: pointer;
    }
    button:hover {
      background: var(--accent-strong);
      color: var(--accent-contrast-strong);
    }
    #generate {
      border-color: var(--accent);
      background: #ffffff;
      color: var(--ink);
    }
    #generate:hover {
      border-color: var(--accent-strong);
      background: var(--panel-strong);
      color: var(--ink);
    }
    select:focus-visible,
    input:focus-visible,
    button:focus-visible,
    .class-row:focus-visible {
      outline: 1px solid var(--accent);
      outline-offset: 2px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }
    button.icon-button {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border-color: var(--line);
      background: #ffffff;
      color: var(--ink);
      font-weight: 400;
    }
    button.icon-button:hover {
      border-color: var(--accent);
      background: var(--panel-strong);
      color: var(--ink);
    }
    button.legend-toggle {
      border-color: transparent;
      background: transparent;
      color: var(--muted);
    }
    button.legend-toggle:hover {
      border-color: transparent;
      background: var(--panel-strong);
      color: var(--ink);
    }
    .legend-toggle::before {
      width: 8px;
      height: 8px;
      border-left: 1px solid currentColor;
      border-bottom: 1px solid currentColor;
      content: "";
      transform: rotate(45deg);
      transition: transform 160ms ease;
    }
    button.switch-toggle {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding: 0;
      border-color: transparent;
      background: transparent;
      color: var(--ink);
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
      white-space: nowrap;
    }
    button.switch-toggle:hover {
      background: transparent;
      color: var(--ink);
    }
    .switch-track {
      position: relative;
      width: 36px;
      height: 20px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel-strong);
      transition: background 120ms ease, border-color 120ms ease;
    }
    .switch-track::after {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid var(--line);
      content: "";
      transition: transform 120ms ease, border-color 120ms ease;
    }
    button.switch-toggle[aria-pressed="true"] .switch-track {
      background: var(--accent);
      border-color: var(--accent);
    }
    button.switch-toggle[aria-pressed="true"] .switch-track::after {
      transform: translateX(16px);
      border-color: var(--accent);
    }
    .draw-toolbar {
      grid-row: 3;
      display: grid;
      grid-template-columns: minmax(180px, 300px) minmax(180px, 280px) auto;
      gap: 12px;
      align-items: end;
      justify-content: end;
      min-width: 0;
      padding: 10px 22px;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }
    .draw-toolbar[hidden] {
      display: none;
    }
    main {
      grid-row: 4;
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr) minmax(0, 1fr);
      gap: 18px;
      padding: 22px;
      align-items: start;
      transition: grid-template-columns 180ms ease;
    }
    main.legend-collapsed {
      grid-template-columns: 38px minmax(0, 1fr) minmax(0, 1fr);
    }
    .viewer {
      min-width: 0;
      display: grid;
      gap: 10px;
    }
    .viewer-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
      min-height: 38px;
    }
    .ground-truth {
      display: grid;
      gap: 10px;
    }
    .ground-truth[hidden] {
      display: none;
    }
    .viewer h2,
    .classes h2 {
      margin: 0;
      font-size: 14px;
      line-height: 1.2;
      font-weight: 400;
      letter-spacing: 0;
    }
    .frame {
      aspect-ratio: 1;
      width: 100%;
      max-height: calc(100vh - 210px);
      min-height: 260px;
      border: 1px solid var(--line);
      background: var(--panel-strong);
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .frame img,
    .frame canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
    }
    .frame canvas {
      cursor: default;
      touch-action: none;
    }
    .frame canvas.drawing {
      cursor: crosshair;
    }
    .empty {
      color: var(--muted);
      font-size: 13px;
    }
    .progress {
      grid-row: 2;
      display: grid;
      gap: 6px;
      min-height: 42px;
      padding: 8px 22px 10px;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }
    .progress[hidden] {
      display: none;
    }
    .progress-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }
    .progress-count {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .progress.error .progress-line,
    .progress.error .progress-count {
      color: var(--warn);
    }
    progress {
      width: 100%;
      height: 8px;
      border: 0;
      border-radius: 999px;
      overflow: hidden;
      background: var(--panel-strong);
      accent-color: var(--accent);
    }
    progress::-webkit-progress-bar {
      background: var(--panel-strong);
    }
    progress::-webkit-progress-value {
      background: var(--accent);
    }
    progress::-moz-progress-bar {
      background: var(--accent);
    }
    .progress.error progress {
      accent-color: var(--warn);
    }
    .progress.error progress::-webkit-progress-value {
      background: var(--warn);
    }
    .progress.error progress::-moz-progress-bar {
      background: var(--warn);
    }
    .classes {
      display: grid;
      gap: 10px;
      min-width: 0;
      padding-left: 0;
      overflow: hidden;
      transition: gap 180ms ease;
    }
    main.legend-collapsed .classes {
      gap: 0;
    }
    .side-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 28px;
    }
    .legend-title {
      min-width: 0;
      max-width: 140px;
      overflow: hidden;
      white-space: nowrap;
      transition: max-width 180ms ease, opacity 140ms ease;
    }
    main.legend-collapsed .legend-title {
      max-width: 0;
      opacity: 0;
    }
    main.legend-collapsed .side-heading {
      justify-content: center;
    }
    main.legend-collapsed .legend-toggle::before {
      transform: rotate(-135deg);
    }
    .draw-tools {
      display: contents;
    }
    .brush-label {
      grid-template-columns: 1fr auto;
      align-items: center;
    }
    .brush-label input {
      grid-column: 1 / -1;
      padding: 0;
      accent-color: var(--accent);
    }
    .brush-value {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    button.secondary {
      border-color: var(--line);
      background: #ffffff;
      color: var(--ink);
    }
    button.secondary:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--ink);
    }
    .class-list {
      display: grid;
      gap: 7px;
      max-height: 520px;
      overflow: hidden;
      opacity: 1;
      transform: translateX(0);
      transition: max-height 180ms ease, opacity 140ms ease, transform 180ms ease;
    }
    main.legend-collapsed .class-list {
      max-height: 0;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-8px);
    }
    .class-row {
      display: grid;
      grid-template-columns: 16px 1fr auto;
      gap: 8px;
      align-items: center;
      min-height: 24px;
      padding: 3px 4px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .class-row.selected {
      background: var(--accent-soft);
      color: var(--ink);
      outline: 1px solid var(--line);
    }
    .swatch {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      border: 1px solid rgba(0, 0, 0, 0.18);
    }
    .class-id {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .class-row.selected .class-id {
      color: var(--muted);
    }
    footer {
      grid-row: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 34px;
      padding: 8px 22px 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      background: #ffffff;
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    .status-message {
      flex: 0 0 auto;
    }
    footer .meta {
      flex: 1 1 auto;
      min-width: 0;
    }
    .status-message.error {
      color: var(--warn);
    }
    @media (max-width: 960px) {
      header {
        align-items: stretch;
        flex-direction: column;
      }
      main {
        grid-template-columns: 1fr;
      }
      main.legend-collapsed {
        grid-template-columns: 1fr;
      }
      .frame {
        max-height: none;
      }
      .controls {
        grid-template-columns: 1fr 1fr;
        margin-left: 0;
      }
      .controls button {
        grid-column: auto;
      }
      .draw-toolbar {
        grid-template-columns: 1fr;
      }
    }
    @media (max-width: 560px) {
      .controls {
        grid-template-columns: 1fr;
      }
      .controls button {
        grid-column: auto;
      }
      main,
      header,
      .controls,
      .progress,
      footer {
        padding-left: 14px;
        padding-right: 14px;
      }
      .draw-toolbar {
        padding-left: 14px;
        padding-right: 14px;
      }
      .frame {
        min-height: 220px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>Sim Satellite</h1>
      <div class="controls">
        <label>
          Mask sample
          <select id="sample"></select>
        </label>
        <label>
          Seed
          <input id="seed" type="number" min="0" step="1">
        </label>
        <label>
          Steps
          <input id="steps" type="number" min="1" step="1">
        </label>
        <button id="generate" type="button">Generate</button>
      </div>
    </header>
    <div class="progress" id="progress" hidden>
      <div class="progress-line">
        <span id="progress-label">Starting</span>
        <span class="progress-count" id="progress-count">0 / 0</span>
      </div>
      <progress id="progress-bar" max="1" value="0"></progress>
    </div>
    <div class="draw-toolbar" id="draw-toolbar" hidden>
      <div class="draw-tools">
        <label>
          Paint class
          <select id="paint-class"></select>
        </label>
        <label class="brush-label">
          Brush
          <span class="brush-value" id="brush-value">12</span>
          <input id="brush-size" type="range" min="1" max="64" step="1" value="12">
        </label>
        <button id="reset-mask" class="secondary" type="button">Reset mask</button>
      </div>
    </div>
    <main>
      <aside class="classes">
        <div class="side-heading">
          <h2 class="legend-title">Classes</h2>
          <button id="legend-toggle" class="icon-button legend-toggle" type="button" aria-expanded="true" aria-controls="classes" title="Hide classes">
            <span class="sr-only">Hide classes</span>
          </button>
        </div>
        <div id="classes" class="class-list"></div>
      </aside>
      <section class="viewer">
        <div class="viewer-heading">
          <h2>Condition mask</h2>
          <button id="draw-mode" class="switch-toggle" type="button" aria-pressed="false">
            <span class="switch-track" aria-hidden="true"></span>
            <span>Draw</span>
          </button>
        </div>
        <div class="frame"><canvas id="mask" aria-label="Condition mask"></canvas></div>
        <div class="ground-truth" id="ground-truth-panel">
          <h2>Ground truth image</h2>
          <div class="frame"><img id="ground-truth" alt="Ground truth satellite image"></div>
        </div>
      </section>
      <section class="viewer">
        <h2>Generated image</h2>
        <div class="frame" id="output-frame"><div class="empty">No image yet</div></div>
      </section>
    </main>
    <footer>
      <span class="status-message" id="status">Ready</span>
      <div class="meta" id="meta">Loading checkpoint...</div>
    </footer>
  </div>
  <script>
    const sampleSelect = document.getElementById("sample");
    const seedInput = document.getElementById("seed");
    const stepsInput = document.getElementById("steps");
    const generateButton = document.getElementById("generate");
    const maskCanvas = document.getElementById("mask");
    const groundTruthImage = document.getElementById("ground-truth");
    const groundTruthPanel = document.getElementById("ground-truth-panel");
    const drawToolbar = document.getElementById("draw-toolbar");
    const drawModeInput = document.getElementById("draw-mode");
    const paintClassSelect = document.getElementById("paint-class");
    const brushSizeInput = document.getElementById("brush-size");
    const brushValue = document.getElementById("brush-value");
    const resetMaskButton = document.getElementById("reset-mask");
    const outputFrame = document.getElementById("output-frame");
    const statusEl = document.getElementById("status");
    const mainEl = document.querySelector("main");
    const legendToggle = document.getElementById("legend-toggle");
    const legendToggleLabel = legendToggle.querySelector(".sr-only");
    const classesEl = document.getElementById("classes");
    const metaEl = document.getElementById("meta");
    const progressEl = document.getElementById("progress");
    const progressLabel = document.getElementById("progress-label");
    const progressCount = document.getElementById("progress-count");
    const progressBar = document.getElementById("progress-bar");

    let classes = [];
    let activeClassId = 0;
    let maskDirty = false;
    let isDrawing = false;
    let lastPoint = null;
    let latestState = null;
    let legendCollapsed = false;

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.classList.toggle("error", isError);
    }

    function updateLegendCollapsed() {
      mainEl.classList.toggle("legend-collapsed", legendCollapsed);
      legendToggle.setAttribute("aria-expanded", String(!legendCollapsed));
      legendToggle.title = legendCollapsed ? "Show classes" : "Hide classes";
      legendToggleLabel.textContent = legendCollapsed ? "Show classes" : "Hide classes";
      classesEl.setAttribute("aria-hidden", String(legendCollapsed));
      [...classesEl.querySelectorAll(".class-row")].forEach((row) => {
        row.tabIndex = legendCollapsed ? -1 : 0;
      });
    }

    function toggleLegend() {
      legendCollapsed = !legendCollapsed;
      updateLegendCollapsed();
    }

    function showProgress(steps) {
      const total = Math.max(Number(steps) || 1, 1);
      progressEl.hidden = false;
      progressEl.classList.remove("error");
      progressBar.max = total;
      progressBar.value = 0;
      progressLabel.textContent = "Starting";
      progressCount.textContent = `0 / ${total}`;
    }

    function updateProgress(step, steps) {
      const total = Math.max(Number(steps) || 1, 1);
      const current = Math.min(Math.max(Number(step) || 0, 0), total);
      progressEl.classList.remove("error");
      progressBar.max = total;
      progressBar.value = current;
      progressLabel.textContent = current >= total ? "Complete" : "Generating";
      progressCount.textContent = `${current} / ${total}`;
    }

    function failProgress() {
      if (!progressEl.hidden) {
        progressEl.classList.add("error");
        progressLabel.textContent = "Failed";
      }
    }

    function renderMeta(state) {
      metaEl.textContent = [
        state.checkpointPath || "Waiting for checkpoint",
        state.device,
        `${state.samples.length} masks`
      ].join(" | ");
    }

    function renderMask(index) {
      const image = new Image();
      image.onload = () => {
        maskCanvas.width = image.naturalWidth;
        maskCanvas.height = image.naturalHeight;
        const context = maskCanvas.getContext("2d", { willReadFrequently: true });
        context.imageSmoothingEnabled = false;
        context.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
        context.drawImage(image, 0, 0);
        maskDirty = false;
        setStatus("Ready");
      };
      image.onerror = () => setStatus("Could not load mask", true);
      image.src = `/api/mask?index=${index}&t=${Date.now()}`;
    }

    function renderGroundTruth(index) {
      groundTruthImage.src = `/api/image?index=${index}&t=${Date.now()}`;
    }

    function renderSample(index) {
      renderMask(index);
      renderGroundTruth(index);
    }

    async function loadState() {
      const response = await fetch("/api/state");
      const state = await response.json();
      if (!response.ok) throw new Error(state.detail || state.error || "Could not load state");
      latestState = state;

      seedInput.value = state.seed;
      stepsInput.value = state.steps;
      renderMeta(state);

      sampleSelect.innerHTML = "";
      state.samples.forEach((sample) => {
        const option = document.createElement("option");
        option.value = sample.index;
        option.textContent = `${sample.index} - ${sample.name}`;
        sampleSelect.appendChild(option);
      });

      classes = state.classes;
      const defaultClass = classes.find((item) => item.name === "building") || classes[0];
      activeClassId = defaultClass.id;
      renderPaintClassOptions();
      classesEl.innerHTML = "";
      classes.forEach((item) => {
        const row = document.createElement("div");
        row.className = "class-row";
        row.dataset.classId = item.id;
        row.tabIndex = 0;
        row.setAttribute("role", "button");
        const swatch = document.createElement("span");
        swatch.className = "swatch";
        swatch.style.backgroundColor = `rgb(${item.rgb[0]}, ${item.rgb[1]}, ${item.rgb[2]})`;
        const name = document.createElement("span");
        name.textContent = item.name;
        const id = document.createElement("span");
        id.className = "class-id";
        id.textContent = item.id;
        row.append(swatch, name, id);
        row.addEventListener("click", () => selectClass(item.id));
        row.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectClass(item.id);
          }
        });
        classesEl.appendChild(row);
      });
      updateClassSelection();
      updateLegendCollapsed();
      updateBrushValue();
      updateDrawingMode();

      renderSample(sampleSelect.value || 0);
    }

    async function refreshStateMetadata() {
      const response = await fetch("/api/state");
      const state = await response.json();
      if (!response.ok) throw new Error(state.detail || state.error || "Could not load state");
      latestState = state;
      renderMeta(state);
      return state;
    }

    async function generate() {
      generateButton.disabled = true;
      generateButton.textContent = "Generating";
      showProgress(stepsInput.value);
      setStatus("Starting generation...");
      try {
        await refreshStateMetadata();
        const body = {
          index: Number(sampleSelect.value),
          seed: Number(seedInput.value),
          steps: Number(stepsInput.value)
        };
        if (maskDirty) {
          body.maskImage = maskCanvas.toDataURL("image/png");
        }

        const response = await fetch("/api/generate/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        if (!response.ok) {
          const payload = await response.json().catch(() => ({}));
          throw new Error(payload.detail || payload.error || "Generation failed");
        }
        if (!response.body) throw new Error("Generation progress stream is unavailable");

        const payload = await readGenerationStream(response.body);
        if (!payload) throw new Error("Generation ended before the image was ready");
        renderGeneratedImage(payload);
      } catch (error) {
        failProgress();
        setStatus(error.message, true);
      } finally {
        generateButton.disabled = false;
        generateButton.textContent = "Generate";
      }
    }

    async function readGenerationStream(stream) {
      const reader = stream.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let completedPayload = null;

      while (true) {
        const { value, done } = await reader.read();
        buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
        const lines = buffer.split("\n");
        buffer = lines.pop() || "";

        for (const line of lines) {
          const payload = handleGenerationEvent(JSON.parse(line));
          if (payload) completedPayload = payload;
        }

        if (done) break;
      }

      if (buffer.trim()) {
        const payload = handleGenerationEvent(JSON.parse(buffer));
        if (payload) completedPayload = payload;
      }

      return completedPayload;
    }

    function handleGenerationEvent(payload) {
      if (payload.event === "start") {
        updateProgress(0, payload.steps);
        setStatus("Loading model...");
        return null;
      }
      if (payload.event === "step") {
        updateProgress(payload.step, payload.steps);
        setStatus(`Generating step ${payload.step} of ${payload.steps}`);
        return null;
      }
      if (payload.event === "complete") {
        updateProgress(payload.steps, payload.steps);
        return payload;
      }
      if (payload.event === "error") {
        throw new Error(payload.detail || "Generation failed");
      }
      return null;
    }

    function renderGeneratedImage(payload) {
      const image = document.createElement("img");
      image.id = "generated";
      image.alt = "Generated satellite image";
      image.src = payload.image;
      outputFrame.replaceChildren(image);

      const message = [
        `Generated ${payload.sample.name}`,
        payload.maskEdited ? "edited mask" : "sample mask",
        `seed ${payload.seed}`,
        `${payload.steps} steps`
      ].join(" | ");
      setStatus(message);
    }

    function renderPaintClassOptions() {
      paintClassSelect.innerHTML = "";
      classes.forEach((item) => {
        const option = document.createElement("option");
        option.value = item.id;
        option.textContent = `${item.id} - ${item.name}`;
        paintClassSelect.appendChild(option);
      });
      paintClassSelect.value = String(activeClassId);
    }

    function selectClass(classId) {
      activeClassId = classId;
      paintClassSelect.value = String(classId);
      updateClassSelection();
    }

    function updateClassSelection() {
      [...classesEl.querySelectorAll(".class-row")].forEach((row) => {
        row.classList.toggle("selected", Number(row.dataset.classId) === activeClassId);
      });
    }

    function updateBrushValue() {
      brushValue.textContent = brushSizeInput.value;
    }

    function updateDrawingMode() {
      const isEnabled = drawModeInput.getAttribute("aria-pressed") === "true";
      maskCanvas.classList.toggle("drawing", isEnabled);
      groundTruthPanel.hidden = isEnabled;
      drawToolbar.hidden = !isEnabled;
    }

    function canDraw() {
      return (
        drawModeInput.getAttribute("aria-pressed") === "true"
        && maskCanvas.width > 0
        && maskCanvas.height > 0
      );
    }

    function toggleDrawingMode() {
      const isEnabled = drawModeInput.getAttribute("aria-pressed") === "true";
      drawModeInput.setAttribute("aria-pressed", String(!isEnabled));
      updateDrawingMode();
    }

    function canvasPoint(event) {
      const rect = maskCanvas.getBoundingClientRect();
      return {
        x: Math.floor((event.clientX - rect.left) * maskCanvas.width / rect.width),
        y: Math.floor((event.clientY - rect.top) * maskCanvas.height / rect.height)
      };
    }

    function activeColor() {
      const item = classes.find((candidate) => candidate.id === activeClassId) || classes[0];
      return `rgb(${item.rgb[0]}, ${item.rgb[1]}, ${item.rgb[2]})`;
    }

    function paintAt(point) {
      const size = Number(brushSizeInput.value);
      const offset = Math.floor(size / 2);
      const context = maskCanvas.getContext("2d");
      context.imageSmoothingEnabled = false;
      context.fillStyle = activeColor();
      context.fillRect(point.x - offset, point.y - offset, size, size);
      maskDirty = true;
    }

    function paintLine(from, to) {
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      const steps = Math.max(Math.abs(dx), Math.abs(dy), 1);
      for (let index = 0; index <= steps; index += 1) {
        paintAt({
          x: Math.round(from.x + dx * index / steps),
          y: Math.round(from.y + dy * index / steps)
        });
      }
    }

    maskCanvas.addEventListener("pointerdown", (event) => {
      if (!canDraw()) return;
      event.preventDefault();
      isDrawing = true;
      lastPoint = canvasPoint(event);
      maskCanvas.setPointerCapture(event.pointerId);
      paintAt(lastPoint);
    });

    maskCanvas.addEventListener("pointermove", (event) => {
      if (!isDrawing || !canDraw()) return;
      event.preventDefault();
      const point = canvasPoint(event);
      paintLine(lastPoint, point);
      lastPoint = point;
    });

    function stopDrawing(event) {
      if (!isDrawing) return;
      event.preventDefault();
      isDrawing = false;
      lastPoint = null;
    }

    maskCanvas.addEventListener("pointerup", stopDrawing);
    maskCanvas.addEventListener("pointercancel", stopDrawing);
    legendToggle.addEventListener("click", toggleLegend);
    drawModeInput.addEventListener("click", toggleDrawingMode);
    paintClassSelect.addEventListener("change", () => selectClass(Number(paintClassSelect.value)));
    brushSizeInput.addEventListener("input", updateBrushValue);
    resetMaskButton.addEventListener("click", () => renderMask(sampleSelect.value || 0));
    sampleSelect.addEventListener("change", () => renderSample(sampleSelect.value));
    generateButton.addEventListener("click", generate);
    loadState().catch((error) => setStatus(error.message, true));
    setInterval(() => {
      refreshStateMetadata().catch(() => {});
    }, 30000);
  </script>
</body>
</html>
