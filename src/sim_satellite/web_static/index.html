<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sim Satellite</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d2520;
      --muted: #69736c;
      --line: #cfd8d1;
      --panel: #f7faf7;
      --panel-strong: #edf3ef;
      --accent: #2d6a4f;
      --accent-strong: #1b4332;
      --warn: #b84a20;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: #fbfcfb;
    }
    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: 0;
    }
    .meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      text-align: right;
      overflow-wrap: anywhere;
    }
    .controls {
      display: grid;
      grid-template-columns: minmax(180px, 2fr) repeat(2, minmax(84px, 120px)) auto;
      gap: 10px;
      align-items: end;
      padding: 14px 22px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }
    select,
    input,
    button {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
      font-size: 14px;
      background: #ffffff;
      color: var(--ink);
    }
    select,
    input {
      padding: 0 10px;
      width: 100%;
    }
    button {
      padding: 0 16px;
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover {
      background: var(--accent-strong);
    }
    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 260px;
      gap: 18px;
      padding: 22px;
      align-items: start;
    }
    .viewer {
      min-width: 0;
      display: grid;
      gap: 10px;
    }
    .viewer h2,
    .classes h2 {
      margin: 0;
      font-size: 14px;
      line-height: 1.2;
      font-weight: 750;
      letter-spacing: 0;
    }
    .frame {
      aspect-ratio: 1;
      width: 100%;
      max-height: calc(100vh - 210px);
      min-height: 260px;
      border: 1px solid var(--line);
      background: var(--panel-strong);
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
    }
    .empty {
      color: var(--muted);
      font-size: 13px;
    }
    .classes {
      display: grid;
      gap: 10px;
      padding-left: 2px;
    }
    .class-list {
      display: grid;
      gap: 7px;
    }
    .class-row {
      display: grid;
      grid-template-columns: 16px 1fr auto;
      gap: 8px;
      align-items: center;
      min-height: 24px;
      font-size: 13px;
    }
    .swatch {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      border: 1px solid rgba(0, 0, 0, 0.18);
    }
    .class-id {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    footer {
      min-height: 34px;
      padding: 8px 22px 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      background: #ffffff;
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    footer.error {
      color: var(--warn);
    }
    @media (max-width: 960px) {
      main {
        grid-template-columns: 1fr;
      }
      .frame {
        max-height: none;
      }
      .controls {
        grid-template-columns: 1fr 1fr;
      }
      button {
        grid-column: span 2;
      }
      header {
        align-items: flex-start;
        flex-direction: column;
      }
      .meta {
        text-align: left;
      }
    }
    @media (max-width: 560px) {
      .controls {
        grid-template-columns: 1fr;
      }
      button {
        grid-column: auto;
      }
      main,
      header,
      .controls,
      footer {
        padding-left: 14px;
        padding-right: 14px;
      }
      .frame {
        min-height: 220px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>Sim Satellite</h1>
      <div class="meta" id="meta">Loading checkpoint...</div>
    </header>
    <div class="controls">
      <label>
        Mask sample
        <select id="sample"></select>
      </label>
      <label>
        Seed
        <input id="seed" type="number" min="0" step="1">
      </label>
      <label>
        Steps
        <input id="steps" type="number" min="1" step="1">
      </label>
      <button id="generate" type="button">Generate</button>
    </div>
    <main>
      <section class="viewer">
        <h2>Condition mask</h2>
        <div class="frame"><img id="mask" alt="Condition mask"></div>
      </section>
      <section class="viewer">
        <h2>Generated image</h2>
        <div class="frame" id="output-frame"><div class="empty">No image yet</div></div>
      </section>
      <aside class="classes">
        <h2>Classes</h2>
        <div id="classes" class="class-list"></div>
      </aside>
    </main>
    <footer id="status">Ready</footer>
  </div>
  <script>
    const sampleSelect = document.getElementById("sample");
    const seedInput = document.getElementById("seed");
    const stepsInput = document.getElementById("steps");
    const generateButton = document.getElementById("generate");
    const maskImage = document.getElementById("mask");
    const outputFrame = document.getElementById("output-frame");
    const statusEl = document.getElementById("status");
    const classesEl = document.getElementById("classes");
    const metaEl = document.getElementById("meta");

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.classList.toggle("error", isError);
    }

    function renderMask(index) {
      maskImage.src = `/api/mask?index=${index}&t=${Date.now()}`;
    }

    async function loadState() {
      const response = await fetch("/api/state");
      const state = await response.json();
      if (!response.ok) throw new Error(state.detail || state.error || "Could not load state");

      seedInput.value = state.seed;
      stepsInput.value = state.steps;
      metaEl.textContent = [
        state.checkpointPath,
        state.device,
        `${state.samples.length} masks`
      ].join(" | ");

      sampleSelect.innerHTML = "";
      state.samples.forEach((sample) => {
        const option = document.createElement("option");
        option.value = sample.index;
        option.textContent = `${sample.index} - ${sample.name}`;
        sampleSelect.appendChild(option);
      });

      classesEl.innerHTML = "";
      state.classes.forEach((item) => {
        const row = document.createElement("div");
        row.className = "class-row";
        const swatch = document.createElement("span");
        swatch.className = "swatch";
        swatch.style.backgroundColor = `rgb(${item.rgb[0]}, ${item.rgb[1]}, ${item.rgb[2]})`;
        const name = document.createElement("span");
        name.textContent = item.name;
        const id = document.createElement("span");
        id.className = "class-id";
        id.textContent = item.id;
        row.append(swatch, name, id);
        classesEl.appendChild(row);
      });

      renderMask(sampleSelect.value || 0);
    }

    async function generate() {
      generateButton.disabled = true;
      setStatus("Generating...");
      try {
        const response = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            index: Number(sampleSelect.value),
            seed: Number(seedInput.value),
            steps: Number(stepsInput.value)
          })
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.detail || payload.error || "Generation failed");

        const image = document.createElement("img");
        image.id = "generated";
        image.alt = "Generated satellite image";
        image.src = payload.image;
        outputFrame.replaceChildren(image);

        const message = [
          `Generated ${payload.sample.name}`,
          `seed ${payload.seed}`,
          `${payload.steps} steps`
        ].join(" | ");
        setStatus(message);
      } catch (error) {
        setStatus(error.message, true);
      } finally {
        generateButton.disabled = false;
      }
    }

    sampleSelect.addEventListener("change", () => renderMask(sampleSelect.value));
    generateButton.addEventListener("click", generate);
    loadState().catch((error) => setStatus(error.message, true));
  </script>
</body>
</html>
