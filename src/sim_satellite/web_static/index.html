<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sim Satellite</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d2520;
      --muted: #69736c;
      --line: #cfd8d1;
      --panel: #f7faf7;
      --panel-strong: #edf3ef;
      --accent: #2d6a4f;
      --accent-strong: #1b4332;
      --warn: #b84a20;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: #fbfcfb;
    }
    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: 0;
    }
    .meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      text-align: right;
      overflow-wrap: anywhere;
    }
    .controls {
      display: grid;
      grid-template-columns: minmax(180px, 2fr) repeat(2, minmax(84px, 120px)) auto;
      gap: 10px;
      align-items: end;
      padding: 14px 22px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }
    select,
    input,
    button {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
      font-size: 14px;
      background: #ffffff;
      color: var(--ink);
    }
    select,
    input {
      padding: 0 10px;
      width: 100%;
    }
    button {
      padding: 0 16px;
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover {
      background: var(--accent-strong);
    }
    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 260px;
      gap: 18px;
      padding: 22px;
      align-items: start;
    }
    .viewer {
      min-width: 0;
      display: grid;
      gap: 10px;
    }
    .viewer h2,
    .classes h2 {
      margin: 0;
      font-size: 14px;
      line-height: 1.2;
      font-weight: 750;
      letter-spacing: 0;
    }
    .frame {
      aspect-ratio: 1;
      width: 100%;
      max-height: calc(100vh - 210px);
      min-height: 260px;
      border: 1px solid var(--line);
      background: var(--panel-strong);
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .frame img,
    .frame canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
    }
    .frame canvas {
      cursor: default;
      touch-action: none;
    }
    .frame canvas.drawing {
      cursor: crosshair;
    }
    .empty {
      color: var(--muted);
      font-size: 13px;
    }
    .classes {
      display: grid;
      gap: 10px;
      padding-left: 2px;
    }
    .side-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .draw-toggle {
      display: flex;
      grid-auto-flow: column;
      align-items: center;
      gap: 7px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
    }
    .draw-toggle input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--accent);
    }
    .draw-tools {
      display: grid;
      gap: 9px;
      padding-bottom: 2px;
    }
    .brush-label {
      grid-template-columns: 1fr auto;
      align-items: center;
    }
    .brush-label input {
      grid-column: 1 / -1;
      padding: 0;
      accent-color: var(--accent);
    }
    .brush-value {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    button.secondary {
      border-color: var(--line);
      background: #ffffff;
      color: var(--ink);
    }
    button.secondary:hover {
      border-color: var(--accent);
      background: var(--panel-strong);
    }
    .class-list {
      display: grid;
      gap: 7px;
    }
    .class-row {
      display: grid;
      grid-template-columns: 16px 1fr auto;
      gap: 8px;
      align-items: center;
      min-height: 24px;
      padding: 3px 4px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .class-row.selected {
      background: var(--panel-strong);
      outline: 1px solid var(--line);
    }
    .swatch {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      border: 1px solid rgba(0, 0, 0, 0.18);
    }
    .class-id {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    footer {
      min-height: 34px;
      padding: 8px 22px 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      background: #ffffff;
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    footer.error {
      color: var(--warn);
    }
    @media (max-width: 960px) {
      main {
        grid-template-columns: 1fr;
      }
      .frame {
        max-height: none;
      }
      .controls {
        grid-template-columns: 1fr 1fr;
      }
      .controls button {
        grid-column: span 2;
      }
      header {
        align-items: flex-start;
        flex-direction: column;
      }
      .meta {
        text-align: left;
      }
    }
    @media (max-width: 560px) {
      .controls {
        grid-template-columns: 1fr;
      }
      .controls button {
        grid-column: auto;
      }
      main,
      header,
      .controls,
      footer {
        padding-left: 14px;
        padding-right: 14px;
      }
      .frame {
        min-height: 220px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>Sim Satellite</h1>
      <div class="meta" id="meta">Loading checkpoint...</div>
    </header>
    <div class="controls">
      <label>
        Mask sample
        <select id="sample"></select>
      </label>
      <label>
        Seed
        <input id="seed" type="number" min="0" step="1">
      </label>
      <label>
        Steps
        <input id="steps" type="number" min="1" step="1">
      </label>
      <button id="generate" type="button">Generate</button>
    </div>
    <main>
      <section class="viewer">
        <h2>Condition mask</h2>
        <div class="frame"><canvas id="mask" aria-label="Condition mask"></canvas></div>
      </section>
      <section class="viewer">
        <h2>Generated image</h2>
        <div class="frame" id="output-frame"><div class="empty">No image yet</div></div>
      </section>
      <aside class="classes">
        <div class="side-heading">
          <h2>Classes</h2>
          <label class="draw-toggle">
            <input id="draw-mode" type="checkbox">
            Draw
          </label>
        </div>
        <div class="draw-tools">
          <label>
            Paint class
            <select id="paint-class"></select>
          </label>
          <label class="brush-label">
            Brush
            <span class="brush-value" id="brush-value">12</span>
            <input id="brush-size" type="range" min="1" max="64" step="1" value="12">
          </label>
          <button id="reset-mask" class="secondary" type="button">Reset mask</button>
        </div>
        <div id="classes" class="class-list"></div>
      </aside>
    </main>
    <footer id="status">Ready</footer>
  </div>
  <script>
    const sampleSelect = document.getElementById("sample");
    const seedInput = document.getElementById("seed");
    const stepsInput = document.getElementById("steps");
    const generateButton = document.getElementById("generate");
    const maskCanvas = document.getElementById("mask");
    const drawModeInput = document.getElementById("draw-mode");
    const paintClassSelect = document.getElementById("paint-class");
    const brushSizeInput = document.getElementById("brush-size");
    const brushValue = document.getElementById("brush-value");
    const resetMaskButton = document.getElementById("reset-mask");
    const outputFrame = document.getElementById("output-frame");
    const statusEl = document.getElementById("status");
    const classesEl = document.getElementById("classes");
    const metaEl = document.getElementById("meta");

    let classes = [];
    let activeClassId = 0;
    let maskDirty = false;
    let isDrawing = false;
    let lastPoint = null;

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.classList.toggle("error", isError);
    }

    function renderMask(index) {
      const image = new Image();
      image.onload = () => {
        maskCanvas.width = image.naturalWidth;
        maskCanvas.height = image.naturalHeight;
        const context = maskCanvas.getContext("2d", { willReadFrequently: true });
        context.imageSmoothingEnabled = false;
        context.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
        context.drawImage(image, 0, 0);
        maskDirty = false;
        setStatus("Ready");
      };
      image.onerror = () => setStatus("Could not load mask", true);
      image.src = `/api/mask?index=${index}&t=${Date.now()}`;
    }

    async function loadState() {
      const response = await fetch("/api/state");
      const state = await response.json();
      if (!response.ok) throw new Error(state.detail || state.error || "Could not load state");

      seedInput.value = state.seed;
      stepsInput.value = state.steps;
      metaEl.textContent = [
        state.checkpointPath,
        state.device,
        `${state.samples.length} masks`
      ].join(" | ");

      sampleSelect.innerHTML = "";
      state.samples.forEach((sample) => {
        const option = document.createElement("option");
        option.value = sample.index;
        option.textContent = `${sample.index} - ${sample.name}`;
        sampleSelect.appendChild(option);
      });

      classes = state.classes;
      const defaultClass = classes.find((item) => item.name === "building") || classes[0];
      activeClassId = defaultClass.id;
      renderPaintClassOptions();
      classesEl.innerHTML = "";
      classes.forEach((item) => {
        const row = document.createElement("div");
        row.className = "class-row";
        row.dataset.classId = item.id;
        row.tabIndex = 0;
        row.setAttribute("role", "button");
        const swatch = document.createElement("span");
        swatch.className = "swatch";
        swatch.style.backgroundColor = `rgb(${item.rgb[0]}, ${item.rgb[1]}, ${item.rgb[2]})`;
        const name = document.createElement("span");
        name.textContent = item.name;
        const id = document.createElement("span");
        id.className = "class-id";
        id.textContent = item.id;
        row.append(swatch, name, id);
        row.addEventListener("click", () => selectClass(item.id));
        row.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectClass(item.id);
          }
        });
        classesEl.appendChild(row);
      });
      updateClassSelection();
      updateBrushValue();
      updateDrawingMode();

      renderMask(sampleSelect.value || 0);
    }

    async function generate() {
      generateButton.disabled = true;
      setStatus("Generating...");
      try {
        const body = {
          index: Number(sampleSelect.value),
          seed: Number(seedInput.value),
          steps: Number(stepsInput.value)
        };
        if (maskDirty) {
          body.maskImage = maskCanvas.toDataURL("image/png");
        }

        const response = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.detail || payload.error || "Generation failed");

        const image = document.createElement("img");
        image.id = "generated";
        image.alt = "Generated satellite image";
        image.src = payload.image;
        outputFrame.replaceChildren(image);

        const message = [
          `Generated ${payload.sample.name}`,
          payload.maskEdited ? "edited mask" : "sample mask",
          `seed ${payload.seed}`,
          `${payload.steps} steps`
        ].join(" | ");
        setStatus(message);
      } catch (error) {
        setStatus(error.message, true);
      } finally {
        generateButton.disabled = false;
      }
    }

    function renderPaintClassOptions() {
      paintClassSelect.innerHTML = "";
      classes.forEach((item) => {
        const option = document.createElement("option");
        option.value = item.id;
        option.textContent = `${item.id} - ${item.name}`;
        paintClassSelect.appendChild(option);
      });
      paintClassSelect.value = String(activeClassId);
    }

    function selectClass(classId) {
      activeClassId = classId;
      paintClassSelect.value = String(classId);
      updateClassSelection();
    }

    function updateClassSelection() {
      [...classesEl.querySelectorAll(".class-row")].forEach((row) => {
        row.classList.toggle("selected", Number(row.dataset.classId) === activeClassId);
      });
    }

    function updateBrushValue() {
      brushValue.textContent = brushSizeInput.value;
    }

    function updateDrawingMode() {
      maskCanvas.classList.toggle("drawing", drawModeInput.checked);
    }

    function canDraw() {
      return drawModeInput.checked && maskCanvas.width > 0 && maskCanvas.height > 0;
    }

    function canvasPoint(event) {
      const rect = maskCanvas.getBoundingClientRect();
      return {
        x: Math.floor((event.clientX - rect.left) * maskCanvas.width / rect.width),
        y: Math.floor((event.clientY - rect.top) * maskCanvas.height / rect.height)
      };
    }

    function activeColor() {
      const item = classes.find((candidate) => candidate.id === activeClassId) || classes[0];
      return `rgb(${item.rgb[0]}, ${item.rgb[1]}, ${item.rgb[2]})`;
    }

    function paintAt(point) {
      const size = Number(brushSizeInput.value);
      const offset = Math.floor(size / 2);
      const context = maskCanvas.getContext("2d");
      context.imageSmoothingEnabled = false;
      context.fillStyle = activeColor();
      context.fillRect(point.x - offset, point.y - offset, size, size);
      maskDirty = true;
    }

    function paintLine(from, to) {
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      const steps = Math.max(Math.abs(dx), Math.abs(dy), 1);
      for (let index = 0; index <= steps; index += 1) {
        paintAt({
          x: Math.round(from.x + dx * index / steps),
          y: Math.round(from.y + dy * index / steps)
        });
      }
    }

    maskCanvas.addEventListener("pointerdown", (event) => {
      if (!canDraw()) return;
      event.preventDefault();
      isDrawing = true;
      lastPoint = canvasPoint(event);
      maskCanvas.setPointerCapture(event.pointerId);
      paintAt(lastPoint);
    });

    maskCanvas.addEventListener("pointermove", (event) => {
      if (!isDrawing || !canDraw()) return;
      event.preventDefault();
      const point = canvasPoint(event);
      paintLine(lastPoint, point);
      lastPoint = point;
    });

    function stopDrawing(event) {
      if (!isDrawing) return;
      event.preventDefault();
      isDrawing = false;
      lastPoint = null;
    }

    maskCanvas.addEventListener("pointerup", stopDrawing);
    maskCanvas.addEventListener("pointercancel", stopDrawing);
    drawModeInput.addEventListener("change", updateDrawingMode);
    paintClassSelect.addEventListener("change", () => selectClass(Number(paintClassSelect.value)));
    brushSizeInput.addEventListener("input", updateBrushValue);
    resetMaskButton.addEventListener("click", () => renderMask(sampleSelect.value || 0));
    sampleSelect.addEventListener("change", () => renderMask(sampleSelect.value));
    generateButton.addEventListener("click", generate);
    loadState().catch((error) => setStatus(error.message, true));
  </script>
</body>
</html>
