<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sim Satellite SAM Playground</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101318;
        --panel: #181d25;
        --panel-strong: #202735;
        --border: #303947;
        --text: #f4f7fb;
        --muted: #aeb8c7;
        --subtle: #778396;
        --blue: #00b8ff;
        --green: #52df8f;
        --coral: #ff667f;
        --amber: #ffba49;
        --shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      button,
      select,
      input {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      .shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 18px 24px;
        border-bottom: 1px solid var(--border);
        background: rgba(16, 19, 24, 0.95);
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      .brand h1 {
        margin: 0;
        font-size: 18px;
        line-height: 1.2;
        font-weight: 700;
        letter-spacing: 0;
      }

      .brand span {
        color: var(--muted);
        font-size: 13px;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .link-button,
      .primary-button,
      .icon-button {
        min-height: 36px;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--text);
        text-decoration: none;
        background: var(--panel-strong);
        border: 1px solid var(--border);
      }

      .link-button {
        padding: 0 12px;
        font-size: 13px;
      }

      .primary-button {
        padding: 0 14px;
        background: var(--blue);
        border-color: var(--blue);
        color: #06131a;
        font-weight: 700;
      }

      .icon-button {
        width: 38px;
        font-weight: 800;
      }

      .app {
        flex: 1;
        display: grid;
        grid-template-columns: minmax(260px, 330px) minmax(0, 1fr);
        gap: 18px;
        padding: 18px;
      }

      .sidebar,
      .content {
        min-width: 0;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
      }

      .panel-title {
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
      }

      .panel-body {
        padding: 14px;
      }

      .segmented {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        padding: 4px;
        background: #111720;
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      .segmented button {
        min-height: 34px;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        font-weight: 700;
      }

      .segmented button[aria-pressed="true"] {
        background: var(--panel-strong);
        color: var(--text);
      }

      .sample-row {
        display: grid;
        grid-template-columns: 38px minmax(0, 1fr) 38px;
        gap: 8px;
        align-items: center;
        margin-top: 12px;
      }

      select {
        min-width: 0;
        height: 38px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #111720;
        color: var(--text);
        padding: 0 10px;
      }

      .meta {
        display: grid;
        gap: 8px;
        margin-top: 12px;
        font-size: 12px;
        color: var(--muted);
      }

      .meta div {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .toggle-row,
      .range-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 13px;
        color: var(--muted);
      }

      .toggle-row input {
        width: 18px;
        height: 18px;
        accent-color: var(--green);
      }

      .range-row input {
        min-width: 110px;
        accent-color: var(--blue);
      }

      .content {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(120px, 1fr));
        gap: 10px;
      }

      .metric {
        min-width: 0;
        padding: 12px 14px;
        border-radius: 8px;
        background: var(--panel);
        border: 1px solid var(--border);
      }

      .metric span {
        display: block;
        color: var(--subtle);
        font-size: 12px;
      }

      .metric strong {
        display: block;
        margin-top: 4px;
        font-size: 22px;
        line-height: 1.1;
      }

      .viewer-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .viewer {
        min-width: 0;
        overflow: hidden;
      }

      .viewer-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
      }

      .viewer-title {
        font-weight: 800;
        font-size: 13px;
      }

      .viewer-note {
        color: var(--subtle);
        font-size: 12px;
        text-align: right;
      }

      .frame {
        position: relative;
        aspect-ratio: 1 / 1;
        width: 100%;
        background: #070a0f;
        overflow: hidden;
      }

      .frame img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        image-rendering: auto;
      }

      .overlay {
        opacity: var(--overlay-opacity, 0.78);
      }

      .empty {
        min-height: 180px;
        display: grid;
        place-items: center;
        color: var(--muted);
        padding: 20px;
        text-align: center;
        border: 1px dashed var(--border);
        border-radius: 8px;
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 1040px) {
        .app {
          grid-template-columns: 1fr;
        }

        .sidebar {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .metrics {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 760px) {
        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .top-actions,
        .link-button,
        .primary-button {
          width: 100%;
        }

        .app {
          padding: 12px;
        }

        .sidebar,
        .viewer-grid,
        .metrics {
          grid-template-columns: 1fr;
        }

        .viewer-note {
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <h1>SAM Playground</h1>
          <span>OpenEarthMap masks, baseline SAM, and trained SAM side by side.</span>
        </div>
        <div class="top-actions">
          <a class="link-button" href="/">Diffusion app</a>
          <button class="primary-button" id="refresh" type="button">Refresh</button>
        </div>
      </header>

      <main class="app">
        <aside class="sidebar">
          <section class="panel">
            <div class="panel-header">
              <div class="panel-title">Samples</div>
            </div>
            <div class="panel-body">
              <div class="segmented" role="group" aria-label="Dataset">
                <button id="dataset-labeled" type="button" aria-pressed="true">Labeled</button>
                <button id="dataset-unlabeled" type="button" aria-pressed="false">Unlabeled</button>
              </div>
              <div class="sample-row">
                <button class="icon-button" id="prev-sample" type="button" title="Previous sample">
                  &lt;
                </button>
                <select id="sample-select" aria-label="Sample"></select>
                <button class="icon-button" id="next-sample" type="button" title="Next sample">
                  &gt;
                </button>
              </div>
              <div class="meta" id="sample-meta"></div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <div class="panel-title">Overlays</div>
            </div>
            <div class="panel-body">
              <label class="toggle-row">
                <span>Ground truth labels</span>
                <input id="show-labels" type="checkbox" checked />
              </label>
              <label class="range-row" style="margin-top: 12px">
                <span>Mask opacity</span>
                <input id="opacity" type="range" min="0" max="100" value="78" />
              </label>
            </div>
          </section>
        </aside>

        <section class="content">
          <div class="metrics" id="metrics"></div>

          <div class="viewer-grid" id="viewer-grid">
            <article class="panel viewer">
              <div class="viewer-head">
                <div class="viewer-title">Image + Labels</div>
                <div class="viewer-note" id="truth-note">ground truth</div>
              </div>
              <div class="frame">
                <img id="truth-image" alt="Satellite sample" />
                <img class="overlay" id="truth-overlay" alt="" />
              </div>
            </article>

            <article class="panel viewer">
              <div class="viewer-head">
                <div class="viewer-title">SAM Baseline</div>
                <div class="viewer-note" id="baseline-note">proposal overlay</div>
              </div>
              <div class="frame">
                <img id="baseline-image" alt="Satellite sample" />
                <img class="overlay" id="baseline-overlay" alt="" />
              </div>
            </article>

            <article class="panel viewer">
              <div class="viewer-head">
                <div class="viewer-title">Trained SAM</div>
                <div class="viewer-note" id="trained-note">proposal overlay</div>
              </div>
              <div class="frame">
                <img id="trained-image" alt="Satellite sample" />
                <img class="overlay" id="trained-overlay" alt="" />
              </div>
            </article>
          </div>

          <div class="empty" id="empty-state" hidden>No samples available for this dataset.</div>
        </section>
      </main>
    </div>

    <script>
      const appState = {
        data: null,
        dataset: "labeled",
        index: 0,
      };

      const elements = {
        refresh: document.getElementById("refresh"),
        sampleSelect: document.getElementById("sample-select"),
        prev: document.getElementById("prev-sample"),
        next: document.getElementById("next-sample"),
        showLabels: document.getElementById("show-labels"),
        opacity: document.getElementById("opacity"),
        sampleMeta: document.getElementById("sample-meta"),
        metrics: document.getElementById("metrics"),
        viewerGrid: document.getElementById("viewer-grid"),
        emptyState: document.getElementById("empty-state"),
        datasetButtons: {
          labeled: document.getElementById("dataset-labeled"),
          unlabeled: document.getElementById("dataset-unlabeled"),
        },
        panes: {
          truth: {
            image: document.getElementById("truth-image"),
            overlay: document.getElementById("truth-overlay"),
            note: document.getElementById("truth-note"),
          },
          baseline: {
            image: document.getElementById("baseline-image"),
            overlay: document.getElementById("baseline-overlay"),
            note: document.getElementById("baseline-note"),
          },
          trained: {
            image: document.getElementById("trained-image"),
            overlay: document.getElementById("trained-overlay"),
            note: document.getElementById("trained-note"),
          },
        },
      };

      async function loadState() {
        const response = await fetch("/api/sam/state");
        if (!response.ok) {
          throw new Error(await response.text());
        }
        appState.data = await response.json();
        if (!samplesFor(appState.dataset).length && samplesFor("unlabeled").length) {
          appState.dataset = "unlabeled";
        }
        appState.index = Math.min(appState.index, Math.max(0, samplesFor(appState.dataset).length - 1));
        render();
      }

      function samplesFor(dataset) {
        return appState.data?.datasets?.[dataset]?.samples || [];
      }

      function proposalSource(dataset, source) {
        return appState.data?.proposalSources?.[dataset]?.[source] || { available: false };
      }

      function render() {
        renderDatasetButtons();
        renderSamples();
        renderMetrics();
        renderViewer();
      }

      function renderDatasetButtons() {
        for (const dataset of ["labeled", "unlabeled"]) {
          elements.datasetButtons[dataset].setAttribute(
            "aria-pressed",
            String(appState.dataset === dataset),
          );
        }
      }

      function renderSamples() {
        const samples = samplesFor(appState.dataset);
        elements.sampleSelect.innerHTML = "";
        samples.forEach((sample, index) => {
          const option = document.createElement("option");
          option.value = String(index);
          option.textContent = `${String(index + 1).padStart(2, "0")}  ${sample.name}`;
          elements.sampleSelect.appendChild(option);
        });
        elements.sampleSelect.value = String(appState.index);
        elements.prev.disabled = samples.length <= 1;
        elements.next.disabled = samples.length <= 1;

        const sample = samples[appState.index];
        elements.sampleMeta.innerHTML = "";
        if (!sample) {
          return;
        }
        const fields = [
          ["source", sample.source],
          ["split", sample.split],
          ["image", sample.imagePath],
        ];
        if (sample.maskPath) {
          fields.push(["mask", sample.maskPath]);
        }
        if (sample.regionKey) {
          fields.push(["region", sample.regionKey]);
        }
        for (const [label, value] of fields) {
          const row = document.createElement("div");
          row.textContent = `${label}: ${value}`;
          elements.sampleMeta.appendChild(row);
        }
      }

      function renderMetrics() {
        const comparison = appState.data.comparison;
        const value = comparison?.value;
        const baseline = value?.baseline;
        const trained = value?.trained;
        const delta = value?.delta;
        const hasComparison = Boolean(value && (baseline || trained || delta));
        elements.metrics.hidden = !hasComparison;
        elements.metrics.innerHTML = "";
        if (!hasComparison) {
          return;
        }
        const metrics = [
          ["baseline IoU", formatNumber(baseline?.mean_best_iou)],
          ["trained IoU", formatNumber(trained?.mean_best_iou)],
          ["delta IoU", formatSigned(delta?.mean_best_iou)],
          ["recall@0.50", formatRecallDelta(delta?.recall_by_threshold?.["0.50"])],
        ];
        for (const [label, number] of metrics) {
          const metric = document.createElement("div");
          metric.className = "metric";
          const span = document.createElement("span");
          span.textContent = label;
          const strong = document.createElement("strong");
          strong.textContent = number;
          metric.append(span, strong);
          elements.metrics.appendChild(metric);
        }
      }

      function renderViewer() {
        const samples = samplesFor(appState.dataset);
        const sample = samples[appState.index];
        const hasSample = Boolean(sample);
        elements.viewerGrid.hidden = !hasSample;
        elements.emptyState.hidden = hasSample;
        if (!hasSample) {
          return;
        }

        document.documentElement.style.setProperty(
          "--overlay-opacity",
          String(Number(elements.opacity.value) / 100),
        );

        const baseUrl = `/api/sam/image?${new URLSearchParams({
          dataset: appState.dataset,
          index: String(appState.index),
        })}`;
        for (const pane of Object.values(elements.panes)) {
          pane.image.src = baseUrl;
        }

        const hasLabels = Boolean(appState.data.datasets[appState.dataset]?.hasLabels);
        elements.panes.truth.overlay.hidden = !hasLabels || !elements.showLabels.checked;
        elements.panes.truth.note.textContent = hasLabels ? "ground truth" : "no labels";
        if (hasLabels && elements.showLabels.checked) {
          elements.panes.truth.overlay.src = overlayUrl("label");
        }

        setProposalOverlay("baseline");
        setProposalOverlay("trained");
      }

      function setProposalOverlay(source) {
        const pane = elements.panes[source];
        const status = proposalSource(appState.dataset, source);
        pane.note.textContent = status.available ? `${status.records} proposals` : "missing";
        pane.overlay.hidden = !status.available;
        if (status.available) {
          pane.overlay.src = overlayUrl(source);
        }
      }

      function overlayUrl(source) {
        return `/api/sam/overlay?${new URLSearchParams({
          dataset: appState.dataset,
          source,
          index: String(appState.index),
        })}`;
      }

      function setDataset(dataset) {
        appState.dataset = dataset;
        appState.index = 0;
        render();
      }

      function stepSample(delta) {
        const total = samplesFor(appState.dataset).length;
        if (!total) {
          return;
        }
        appState.index = (appState.index + delta + total) % total;
        render();
      }

      function formatNumber(value) {
        return typeof value === "number" ? value.toFixed(3) : "n/a";
      }

      function formatSigned(value) {
        if (typeof value !== "number") {
          return "n/a";
        }
        return `${value >= 0 ? "+" : ""}${value.toFixed(3)}`;
      }

      function formatRecallDelta(value) {
        if (typeof value !== "number") {
          return "n/a";
        }
        return `${value >= 0 ? "+" : ""}${(value * 100).toFixed(1)}%`;
      }

      for (const dataset of ["labeled", "unlabeled"]) {
        elements.datasetButtons[dataset].addEventListener("click", () => setDataset(dataset));
      }
      elements.sampleSelect.addEventListener("change", () => {
        appState.index = Number(elements.sampleSelect.value);
        render();
      });
      elements.prev.addEventListener("click", () => stepSample(-1));
      elements.next.addEventListener("click", () => stepSample(1));
      elements.showLabels.addEventListener("change", renderViewer);
      elements.opacity.addEventListener("input", renderViewer);
      elements.refresh.addEventListener("click", loadState);

      loadState().catch((error) => {
        elements.viewerGrid.hidden = true;
        elements.emptyState.hidden = false;
        elements.emptyState.textContent = error.message;
      });
    </script>
  </body>
</html>
